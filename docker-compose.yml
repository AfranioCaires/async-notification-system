name: ubisafe-notifications

x-app-defaults: &app-defaults
  restart: unless-stopped
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-notifications.alerts.requested}
    SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
      ALERT_PROCESSOR_DB_USER: ${ALERT_PROCESSOR_DB_USER:-alert_processor}
      ALERT_PROCESSOR_DB_PASSWORD: ${ALERT_PROCESSOR_DB_PASSWORD:-alert_processor}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-notifications.alerts.requested}
      ALERTS_DLT: ${KAFKA_ALERTS_DLT:-notifications.alerts.requested.dlt}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$ALERTS_TOPIC" --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$ALERTS_DLT" --partitions 1 --replication-factor 1
    restart: "no"

  notification-api:
    <<: *app-defaults
    build:
      context: ./notification-api
    image: ubisafe/notification-api:local
    environment:
      <<: *app-env
      DB_URL: jdbc:mysql://mysql:3306/notification_db?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${NOTIFICATION_DB_USER:-notification}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  alert-processor:
    <<: *app-defaults
    build:
      context: ./alert-processor
    image: ubisafe/alert-processor:local
    environment:
      <<: *app-env
      DB_URL: jdbc:mysql://mysql:3306/alert_processor_db?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${ALERT_PROCESSOR_DB_USER:-alert_processor}
      DB_PASSWORD: ${ALERT_PROCESSOR_DB_PASSWORD:-alert_processor}
      KAFKA_ALERTS_DLT: ${KAFKA_ALERTS_DLT:-notifications.alerts.requested.dlt}
      DELIVERY_FAILING_CLIENT_IDS: ${DELIVERY_FAILING_CLIENT_IDS:-99999}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"

volumes:
  mysql-data:
  kafka-data:
